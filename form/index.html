<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>云启科技 · 客户进线受理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 40px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 16px; padding: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  h1 { font-size: 22px; color: #111; margin-bottom: 6px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #333; margin: 14px 0 6px; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none; transition: border .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: #667eea; }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.ghost {
    background: #f3f4f6; color: #374151; margin-top: 10px; font-weight: 500;
  }
  #result {
    margin-top: 18px; padding: 14px; border-radius: 8px; font-size: 13px;
    display: none; white-space: pre-wrap; word-break: break-all;
  }
  .ok { background: #dcfce7; color: #166534; display: block; }
  .err { background: #fee2e2; color: #991b1b; display: block; }
  .badge {
    display: inline-block; background: #ede9fe; color: #6d28d9;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>云启科技 · 客户进线受理 <span class="badge">AI 自动处理中</span></h1>
    <div class="sub">提交后由 AI 自动分析、分类、生成工单，并通知对应负责人。</div>

    <form id="f">
      <div class="row">
        <div>
          <label>客户姓名 *</label>
          <input name="name" required placeholder="例如：王磊">
        </div>
        <div>
          <label>公司</label>
          <input name="company" placeholder="例如：杭州明远贸易">
        </div>
      </div>
      <div class="row">
        <div>
          <label>联系方式 *</label>
          <input name="contact" required placeholder="邮箱或手机">
        </div>
        <div>
          <label>来源渠道</label>
          <select name="source">
            <option>官网表单</option>
            <option>邮件</option>
            <option>企业微信</option>
            <option>客服电话</option>
            <option>小程序</option>
          </select>
        </div>
      </div>
      <label>问题描述 *</label>
      <textarea name="message" required placeholder="请描述您遇到的问题或需求…"></textarea>

      <button type="submit">提交并生成工单</button>
      <button type="button" class="ghost" onclick="loadSample()">🎲 载入一条模拟客户（演示用）</button>
    </form>

    <div id="result"></div>
  </div>
</div>

<script>
// 部署到 n8n 后，把这里改成你的 Webhook 地址
const WEBHOOK_URL = "http://localhost:5678/webhook/customer-inbox";

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const r = document.getElementById('result');
  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const text = await resp.text();
    r.className = 'ok';
    r.textContent = '✅ 已受理\n' + text;
  } catch (err) {
    r.className = 'err';
    r.textContent = '❌ 请求失败：' + err.message +
      '\n（本地演示模式下，n8n 未启动时会报这个错，属正常现象）';
  }
});

// 从同目录 simulation/sample-tickets.json 随机取一条填入
async function loadSample() {
  try {
    const resp = await fetch('../simulation/sample-tickets.json');
    const data = await resp.json();
    const t = data.tickets[Math.floor(Math.random() * data.tickets.length)];
    document.querySelector('[name=name]').value = t.customer_name;
    document.querySelector('[name=company]').value = t.company_name;
    document.querySelector('[name=contact]').value = t.contact;
    document.querySelector('[name=source]').value = t.source;
    document.querySelector('[name=message]').value = t.message;
    const r = document.getElementById('result');
    r.className = 'ok';
    r.textContent = '已载入模拟数据（人工标注分类：' + t.expected_category +
      '，紧急度：' + t.expected_urgency + '）\n提交后可对比 AI 输出是否一致。';
  } catch (e) {
    alert('请通过本地 HTTP 服务打开本页面（例如 npx serve），或手动在 simulation/sample-tickets.json 里复制一条。');
  }
}
</script>
</body>
</html>
